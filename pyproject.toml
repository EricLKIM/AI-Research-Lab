[project]
name = "ai-research-lab"
version = "0.1.0"
description = "AI 연구 다이제스트 자동화 파이프라인 (AI Times + HuggingFace 크롤링 -> GPT 분석 -> Obsidian 저장)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "tavily-agent-toolkit>=0.1",
    "tzdata>=2026.3",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
